[package]
name = "riftpipe"
version = "0.0.0"
edition = "2021"
license = "Elastic-2.0"
description = "A Unix-like terminal construct for live, peer-to-peer collaborative text (see DESIGN.md)"

[dependencies]
async-trait = "0.1.89"
blake3 = "1.8.5"
bytes = "1.12.0"
data-encoding = "2.11.0"
futures-util = "0.3.32"
iroh = "1.0.0"
# Same major as web/ (wire compat with browser meshes); `net` is the actual
# gossip-over-iroh transport — the only piece the native mesh driver needs.
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
notify = "8.0.0"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.1"
riftpipe-core = { path = "core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "3.1.1"
tiny_http = "0.12.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-util", "rt", "sync", "time"] }
tokio-tungstenite = "0.29.0"
toml = "0.8"
webrtc = "0.17.1"
# Real integrations to wire next — kept out of the scaffold so it builds offline.
# See DESIGN.md §11 (stack):
#   iroh           — QUIC transport, NAT hole-punching, tickets (1.0, Jun 2026)
#   diamond-types  — eg-walker text CRDT (the optimized implementation)
#   ed25519-dalek  — agent keypair / signed ops
#   blake3         — doc ids, rule fingerprints, state hashes
#   similar        — Myers diff for snapshot -> ops (DESIGN.md §3)
#   ratatui + crossterm — TTY repaint mode (DESIGN.md §4)

[[bin]]
name = "riftpipe"
path = "src/main.rs"

# The browser/wasm crates (riftpipe-web + the kanban app's kanban-wasm) build on a
# different target and are verified separately via `web/test-headless.sh` (headless
# Chrome, both crates). Excluded so they never enter the native build/test.
[workspace]
members = ["core"]
exclude = ["web", "projects/kanban/wasm"]
