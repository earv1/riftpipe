[package]
name = "riftpipe-web"
version = "0.0.0"
edition = "2021"
description = "Browser (wasm) side of riftpipe: the web-sys WebRTC data-plane Link"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
riftpipe-core = { path = "../core" }
# iroh in the browser (relay-only — browsers can't UDP-hole-punch). default-features
# off drops `metrics` so the wasm build succeeds (n0's WASM/browser guidance).
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcIceTransportPolicy",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelEvent",
    "RtcDataChannelState",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcIceGatheringState",
    "MessageEvent",
    "Event",
    # WebSocket signaling (connection id in the URL → a room on the signal server).
    "WebSocket",
    "Location",
    # OPFS (Origin Private File System) — local, serverless persistence.
    "Window",
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    "File",
    "Blob",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
