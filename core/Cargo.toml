[package]
name = "riftpipe-core"
version = "0.0.0"
edition = "2021"
license = "Elastic-2.0"
description = "Wasm-compatible core of riftpipe: the eg-walker text CRDT + delta encoding (no transport)"

# Pure-Rust, target-agnostic: this is the one piece of riftpipe that compiles for
# BOTH native and wasm32. The native crate and the browser (wasm) crate both depend
# on it, so the document model + wire encoding have a single source of truth.
[dependencies]
diamond-types = "1.0.0"
similar = "3.1.1"
serde = { version = "1", features = ["derive"] }
# The mesh chunker encodes/splits `MeshMsg` frames; also pins wire compat in tests.
postcard = { version = "1", features = ["alloc"] }
# Mesh crypto (SECURITY.md "first cut"): board secret -> topic + sealed frames.
# blake3 for domain-separated key derivation; XChaCha20-Poly1305 (24-byte nonce,
# so random per-message nonces are safe with no cross-peer coordination) for AEAD.
blake3 = { version = "1", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.2"
# Device-linking auth: Ed25519 signing identities + the signed trust log.
# Pure-Rust, wasm-clean. Keys are generated from a getrandom seed (no rng feature).
ed25519-dalek = { version = "2", default-features = false }
# Read revocation: per-client X25519 encryption keys for epoch-key wrapping.
# Pure-Rust, wasm-clean; secrets are built from a getrandom/KDF seed (no rng feature).
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
# Passkey (WebAuthn) assertion verification: ES256 (P-256/ECDSA) + SHA-256 over
# authenticatorData ‖ SHA-256(clientDataJSON). Pure-Rust, wasm-clean (no ring/openssl).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }
sha2 = { version = "0.10", default-features = false }

# On wasm32, diamond-types' transitive `getrandom` (0.2) needs a browser entropy
# source — enable its `js` backend. Native targets are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
