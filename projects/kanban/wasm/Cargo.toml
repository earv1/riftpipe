[package]
name = "kanban-wasm"
version = "0.0.0"
edition = "2021"
description = "The kanban app's wasm crate: board file format + the in-browser JSON API over OPFS. Depends on riftpipe-web (generic sync/transport), whose #[wasm_bindgen] exports surface from this one cdylib."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
riftpipe-web = { path = "../../../web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    # OPFS (Origin Private File System) handle types used in the handler.
    "Window",
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    "File",
    "Blob",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Standalone wasm crate, outside the root native workspace (like `web/`).
[workspace]
