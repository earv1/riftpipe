[package]
name = "kanban-wasm"
version = "0.0.0"
edition = "2021"
license = "Elastic-2.0"
description = "The kanban app's wasm bundle: a thin passthrough that links riftpipe-web so its generic #[wasm_bindgen] exports (the file API, sync/transport, auth) surface from this one cdylib. Nothing kanban-specific — the domain model lives in TypeScript."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
riftpipe-web = { path = "../../../web" }

# Standalone wasm crate, outside the root native workspace (like `web/`).
[workspace]
