[package]
name = "kanban-server"
version = "0.0.0"
edition = "2021"
description = "The kanban board server: JSON file-API + SPA host over a board directory, on riftpipe's generic hosting layer"

[dependencies]
rand = "0.10.1"
riftpipe = { path = "../../.." }
riftpipe-core = { path = "../../../core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny_http = "0.12.0"

[[bin]]
name = "kanban-server"
path = "src/main.rs"
